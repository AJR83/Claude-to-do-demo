<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<meta name="description" content="A clean, fast, single-file to-do app.">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #f0f2f8;
    --text: #1b1f2a;
    --muted: #7a8194;
    --border: #e4e7f0;
    --accent: #5b5bf0;
    --accent-soft: #ececff;
    --accent-text: #ffffff;
    --danger: #e5484d;
    --success: #1fa971;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 12px 32px rgba(20, 24, 40, .08);
    --radius: 16px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #1f2330;
    --text: #eceef5;
    --muted: #8b92a8;
    --border: #2a2f3f;
    --accent: #7c7cff;
    --accent-soft: #23254a;
    --accent-text: #0f1117;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    transition: background .25s ease, color .25s ease;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 750;
    letter-spacing: -.02em;
  }
  .icon-btn {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: transform .15s ease, background .2s ease;
  }
  .icon-btn:hover { transform: translateY(-1px); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-sun { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }

  /* Progress card */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .progress-top strong { color: var(--text); font-size: 15px; }
  .bar {
    height: 8px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), #8b6cf6);
    border-radius: inherit;
    transition: width .4s cubic-bezier(.3, .8, .3, 1);
  }

  /* Add form */
  .add-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px;
    margin-bottom: 20px;
  }
  .add-form:focus-within { border-color: var(--accent); }
  .add-form input[type="text"] {
    flex: 1 1 200px;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
  }
  .add-form input::placeholder { color: var(--muted); }
  .add-form select,
  .add-form input[type="date"] {
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
  }
  .add-form select:focus,
  .add-form input[type="date"]:focus { border-color: var(--accent); }
  .btn-add {
    border: 0;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 10px;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn-add:hover { filter: brightness(1.08); }
  .btn-add:active { transform: scale(.97); }

  /* Toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .filters {
    display: inline-flex;
    padding: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    gap: 2px;
  }
  .filters button {
    border: 0;
    background: transparent;
    padding: 6px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    transition: background .15s ease, color .15s ease;
  }
  .filters button:hover { color: var(--text); }
  .filters button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(20, 24, 40, .1);
  }
  .link-btn {
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 4px;
  }
  .link-btn:hover { color: var(--danger); }
  .link-btn:disabled { opacity: .4; cursor: default; }
  .link-btn:disabled:hover { color: var(--muted); }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .task {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 14px 16px;
    box-shadow: 0 1px 2px rgba(20, 24, 40, .03);
    animation: pop .25s ease;
    transition: border-color .2s ease, opacity .2s ease;
  }
  .task:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .check {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 22px; height: 22px;
    margin: 0;
    border: 2px solid var(--border);
    border-radius: 7px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .check:hover { border-color: var(--accent); }
  .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check:checked { background: var(--success); border-color: var(--success); }
  .check:checked::after {
    content: "";
    width: 6px; height: 11px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .body { flex: 1; min-width: 0; }
  .title {
    margin: 0;
    font-size: 16px;
    word-break: break-word;
    cursor: text;
  }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .task.done { opacity: .75; }
  .meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
    font-size: 12px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--muted);
  }
  .chip.high { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .chip.medium { background: color-mix(in srgb, #f5a524 18%, transparent); color: #c27c00; }
  :root[data-theme="dark"] .chip.medium { color: #f5a524; }
  .chip.low { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
  .chip.overdue { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

  .edit-input {
    width: 100%;
    border: 1px solid var(--accent);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 16px;
    outline: none;
  }

  .del {
    flex: none;
    width: 34px; height: 34px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .task:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .del svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: none) { .del { opacity: 1; } }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .empty .glyph {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 20px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .empty .glyph svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .empty h2 { margin: 0 0 4px; font-size: 18px; color: var(--text); }
  .empty p { margin: 0; font-size: 14px; }

  .footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 480px) {
    .app { padding-top: 32px; }
    h1 { font-size: 26px; }
    .add-form select, .add-form input[type="date"] { flex: 1; }
    .btn-add { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1>My Tasks</h1>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="progress-card" aria-label="Progress">
      <div class="progress-top">
        <span><strong id="progressText">0 of 0</strong> completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><span id="progressBar"></span></div>
    </section>

    <form class="add-form" id="addForm" autocomplete="off">
      <input type="text" id="newTitle" placeholder="What needs to be done?" maxlength="200" aria-label="New task" required>
      <select id="newPriority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="newDue" aria-label="Due date">
      <button class="btn-add" type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
      </div>
      <button class="link-btn" id="clearDone" type="button">Clear completed</button>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>
    <div id="empty" class="empty" hidden></div>

    <p class="footer">Double-click a task to edit &middot; Saved automatically in your browser</p>
  </main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'tasks.v1';
  var THEME_KEY = 'tasks.theme';

  var state = { tasks: [], filter: 'all' };

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list');
  var emptyEl = $('empty');

  /* ---------- Storage (guarded: may be unavailable) ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      state.tasks = Array.isArray(parsed) ? parsed : [];
    } catch (e) { state.tasks = []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); } catch (e) {}
  }

  /* ---------- Helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function formatDue(iso) {
    var parts = iso.split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var diff = Math.round((d - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- Rendering ---------- */
  var PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

  function visibleTasks() {
    var t = state.tasks.filter(function (x) {
      if (state.filter === 'active') return !x.done;
      if (state.filter === 'done') return x.done;
      return true;
    });
    return t.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (p) return p;
      if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      if (a.due) return -1;
      if (b.due) return 1;
      return b.created - a.created;
    });
  }

  function renderTask(task) {
    var li = el('li', 'task' + (task.done ? ' done' : ''));
    li.dataset.id = task.id;

    var cb = el('input', 'check');
    cb.type = 'checkbox';
    cb.checked = task.done;
    cb.setAttribute('aria-label', 'Mark "' + task.title + '" as ' + (task.done ? 'not done' : 'done'));
    cb.addEventListener('change', function () { toggle(task.id); });

    var body = el('div', 'body');
    var title = el('p', 'title', task.title);
    title.title = 'Double-click to edit';
    title.addEventListener('dblclick', function () { startEdit(task.id, title, body); });
    body.appendChild(title);

    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'chip ' + task.priority, task.priority.charAt(0).toUpperCase() + task.priority.slice(1)));
    if (task.due) {
      var overdue = !task.done && task.due < todayISO();
      meta.appendChild(el('span', 'chip' + (overdue ? ' overdue' : ''), (overdue ? 'Overdue · ' : '') + formatDue(task.due)));
    }
    body.appendChild(meta);

    var del = el('button', 'del');
    del.type = 'button';
    del.setAttribute('aria-label', 'Delete "' + task.title + '"');
    del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(cb);
    li.appendChild(body);
    li.appendChild(del);
    return li;
  }

  function renderEmpty() {
    var msgs = {
      all:    ['You’re all clear', 'Add your first task above to get started.'],
      active: ['Nothing left to do', 'Every task is complete. Nice work.'],
      done:   ['No completed tasks yet', 'Finished tasks will show up here.']
    }[state.filter];
    emptyEl.innerHTML = '';
    var g = el('div', 'glyph');
    g.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    emptyEl.appendChild(g);
    emptyEl.appendChild(el('h2', null, msgs[0]));
    emptyEl.appendChild(el('p', null, msgs[1]));
  }

  function render() {
    var items = visibleTasks();
    listEl.innerHTML = '';
    items.forEach(function (t) { listEl.appendChild(renderTask(t)); });

    if (items.length === 0) { renderEmpty(); emptyEl.hidden = false; }
    else { emptyEl.hidden = true; }

    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    $('progressText').textContent = done + ' of ' + total;
    $('progressPct').textContent = pct + '%';
    $('progressBar').style.width = pct + '%';
    $('clearDone').disabled = done === 0;

    Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter));
    });
  }

  /* ---------- Actions ---------- */
  function add(title, priority, due) {
    state.tasks.push({
      id: uid(), title: title, priority: priority, due: due || '',
      done: false, created: Date.now()
    });
    save(); render();
  }
  function toggle(id) {
    state.tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
    save(); render();
  }
  function remove(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    save(); render();
  }
  function rename(id, title) {
    state.tasks.forEach(function (t) { if (t.id === id) t.title = title; });
    save(); render();
  }

  function startEdit(id, titleEl, body) {
    var task = state.tasks.filter(function (t) { return t.id === id; })[0];
    if (!task) return;
    var input = el('input', 'edit-input');
    input.type = 'text';
    input.maxLength = 200;
    input.value = task.title;
    input.setAttribute('aria-label', 'Edit task');
    body.replaceChild(input, titleEl);
    input.focus();
    input.select();

    var finished = false;
    function commit(apply) {
      if (finished) return;
      finished = true;
      var v = input.value.trim();
      if (apply && v && v !== task.title) rename(id, v); else render();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') commit(true);
      else if (e.key === 'Escape') commit(false);
    });
    input.addEventListener('blur', function () { commit(true); });
  }

  /* ---------- Events ---------- */
  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('newTitle');
    var title = input.value.trim();
    if (!title) return;
    add(title, $('newPriority').value, $('newDue').value);
    input.value = '';
    $('newDue').value = '';
    input.focus();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) {
    b.addEventListener('click', function () { state.filter = b.dataset.filter; render(); });
  });

  $('clearDone').addEventListener('click', function () {
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    save(); render();
  });

  /* ---------- Theme ---------- */
  function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  })();
  $('themeBtn').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* ---------- Init ---------- */
  $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  load();
  render();
})();
</script>
</body>
</html>
